syntax = "proto3";

package truckmoov.tracking.v1;

option go_package = "github.com/truckmoov/services-go/api/proto/gen/tracking/v1;trackingv1";

import "common/v1/common.proto";

service TrackingService {
  rpc GetLatestLocation(GetLatestLocationRequest) returns (GetLatestLocationResponse);
}

message GetLatestLocationRequest {
  string vehicle_id = 1;
}

message GetLatestLocationResponse {
  string vehicle_id = 1;
  truckmoov.common.v1.Coordinates coordinates = 2;
  truckmoov.common.v1.Timestamp observed_at = 3;
}
