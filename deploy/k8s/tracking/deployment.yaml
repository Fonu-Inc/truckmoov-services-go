apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  labels:
    app.kubernetes.io/name: tracking-service
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tracking-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracking-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: tracking-service
          image: tracking-image
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
              name: http
          envFrom:
            - configMapRef:
                name: truckmoov-tracking-config
            - secretRef:
                name: truckmoov-tracking-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /tracking/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /tracking/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
