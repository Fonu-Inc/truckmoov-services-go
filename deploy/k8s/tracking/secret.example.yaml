apiVersion: v1
kind: Secret
metadata:
  name: truckmoov-tracking-secrets
type: Opaque
stringData:
  CORS_ALLOWED_ORIGINS: https://app.example.com
  JWT_SECRET: replace-me
  # self-host ntfy or set NTFY_ERROR_AUTH_TOKEN below — public ntfy.sh topics are world-readable
  NTFY_ERROR_TOPIC_URL: https://ntfy.sh/replace-me
  NTFY_ERROR_AUTH_TOKEN: replace-me
  TIMESCALE_USER: replace-me
  TIMESCALE_PASSWORD: replace-me
