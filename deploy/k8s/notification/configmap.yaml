apiVersion: v1
kind: ConfigMap
metadata:
  name: truckmoov-notification-config
data:
  NOTIFICATION_PORT: "3003"
  NATS_URL: nats://nats:4222
  NATS_STREAM: truckmoov_events
  DEFAULT_TENANT: default
  DISPATCH_SERVICE_URL: http://dispatch-service:3005
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "10028"
  POSTGRES_USER: truckmoov
  POSTGRES_DB: truckmoov
  POSTGRES_SSLMODE: disable
  REDIS_ADDR: redis:6379
  REDIS_DB: "0"
  WHATSAPP_API_BASE_URL: https://graph.facebook.com/v18.0
  WHATSAPP_APP_ID: replace-me
  DOTGO_BASE_URL: https://konnect.dotgo.com
  DOTGO_TRANSACTIONAL_SENDER_MASK: FONU
  # Public address of this service's own receipt route; needs DOTGO_WEBHOOK_SECRET too.
  DOTGO_CALLBACK_URL: https://example-api-host/notify/sms/webhook
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000
