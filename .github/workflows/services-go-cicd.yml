name: Go Services CI/CD

on:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "api/**"
      - "docs/**"
      - "Dockerfile.dispatch"
      - "Dockerfile.notification"
      - "Dockerfile.tracking"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".env.example"
      - ".github/workflows/services-go-cicd.yml"
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "api/**"
      - "docs/**"
      - "Dockerfile.dispatch"
      - "Dockerfile.notification"
      - "Dockerfile.tracking"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".env.example"
      - ".github/workflows/services-go-cicd.yml"
  workflow_dispatch:

concurrency:
  group: services-go-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GO_VERSION: "1.22.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./cmd ./internal ./pkg)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet packages
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build service binaries
        run: |
          set -euo pipefail
          go build ./cmd/dispatch
          go build ./cmd/notification
          go build ./cmd/tracking

  docker-build:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dispatch
            dockerfile: Dockerfile.dispatch
          - service: notification
            dockerfile: Dockerfile.notification
          - service: tracking
            dockerfile: Dockerfile.tracking
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: false
          tags: truckmoov/${{ matrix.service }}:sha-${{ github.sha }}
