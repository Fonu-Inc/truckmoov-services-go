name: Go Services CI/CD

on:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "api/**"
      - "deploy/**"
      - "docs/**"
      - "Dockerfile.dispatch"
      - "Dockerfile.notification"
      - "Dockerfile.tracking"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".env.example"
      - ".github/workflows/services-go-cicd.yml"
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "api/**"
      - "deploy/**"
      - "docs/**"
      - "Dockerfile.dispatch"
      - "Dockerfile.notification"
      - "Dockerfile.tracking"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".env.example"
      - ".github/workflows/services-go-cicd.yml"
  workflow_dispatch:

concurrency:
  group: services-go-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GO_VERSION: "1.22.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./cmd ./internal ./pkg)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet packages
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build service binaries
        run: |
          set -euo pipefail
          go build ./cmd/dispatch
          go build ./cmd/notification
          go build ./cmd/tracking

  docker-build:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dispatch
            dockerfile: Dockerfile.dispatch
          - service: notification
            dockerfile: Dockerfile.notification
          - service: tracking
            dockerfile: Dockerfile.tracking
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: false
          tags: truckmoov/${{ matrix.service }}:sha-${{ github.sha }}

  deploy-go-dev:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Render service kustomize bundles
        env:
          DISPATCH_IMAGE_NAME: truckmoov-dispatch
          NOTIFICATION_IMAGE_NAME: truckmoov-notification
          TRACKING_IMAGE_NAME: truckmoov-tracking
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          rm -rf deploy/.rendered/dispatch deploy/.rendered/notification deploy/.rendered/tracking
          mkdir -p deploy/.rendered
          cp -R deploy/k8s/dispatch deploy/.rendered/dispatch
          cp -R deploy/k8s/notification deploy/.rendered/notification
          cp -R deploy/k8s/tracking deploy/.rendered/tracking
          sed -i "s|newName: .*|newName: ${DISPATCH_IMAGE_NAME}|" deploy/.rendered/dispatch/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" deploy/.rendered/dispatch/kustomization.yaml
          sed -i "s|newName: .*|newName: ${NOTIFICATION_IMAGE_NAME}|" deploy/.rendered/notification/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" deploy/.rendered/notification/kustomization.yaml
          sed -i "s|newName: .*|newName: ${TRACKING_IMAGE_NAME}|" deploy/.rendered/tracking/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" deploy/.rendered/tracking/kustomization.yaml

      - name: Show rendered service bundles
        run: find deploy/.rendered -maxdepth 3 -type f | sort

      - name: Prepare SSH access
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEV_SSH_KEY" >"$RUNNER_TEMP/dev_ssh_key"
          chmod 600 "$RUNNER_TEMP/dev_ssh_key"
          ssh-keyscan -H "$DEV_SSH_HOST" >>"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sync source to deploy host
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEPLOY_PATH: /var/www/truckmoov-go
          SOURCE_PATH: /var/www/truckmoov-go/source/${{ github.sha }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$DEPLOY_PATH\" ] || mkdir -p \"$DEPLOY_PATH\""
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$SOURCE_PATH\" ] || mkdir -p \"$SOURCE_PATH\""
          git archive --format=tar HEAD | ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "tar -xf - -C \"$SOURCE_PATH\""

      - name: Copy service manifests to deploy host
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEPLOY_PATH: /var/www/truckmoov-go
          DISPATCH_MANIFEST_PATH: /var/www/truckmoov-go/rendered/${{ github.sha }}/dispatch
          NOTIFICATION_MANIFEST_PATH: /var/www/truckmoov-go/rendered/${{ github.sha }}/notification
          TRACKING_MANIFEST_PATH: /var/www/truckmoov-go/rendered/${{ github.sha }}/tracking
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$DEPLOY_PATH\" ] || mkdir -p \"$DEPLOY_PATH\""
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$DISPATCH_MANIFEST_PATH\" ] || mkdir -p \"$DISPATCH_MANIFEST_PATH\""
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$NOTIFICATION_MANIFEST_PATH\" ] || mkdir -p \"$NOTIFICATION_MANIFEST_PATH\""
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "[ -d \"$TRACKING_MANIFEST_PATH\" ] || mkdir -p \"$TRACKING_MANIFEST_PATH\""
          tar -C deploy/.rendered/dispatch -czf - . | ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "tar -xzf - -C \"$DISPATCH_MANIFEST_PATH\""
          tar -C deploy/.rendered/notification -czf - . | ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "tar -xzf - -C \"$NOTIFICATION_MANIFEST_PATH\""
          tar -C deploy/.rendered/tracking -czf - . | ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "tar -xzf - -C \"$TRACKING_MANIFEST_PATH\""

      - name: Verify deploy host
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" '
            set -eu
            command -v docker >/dev/null 2>&1
            kubectl config current-context
          '

      - name: Build dispatch image
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DISPATCH_IMAGE: truckmoov-dispatch:sha-${{ github.sha }}
          SOURCE_PATH: /var/www/truckmoov-go/source/${{ github.sha }}
          BUILD_LOG: /tmp/build-dispatch-${{ github.sha }}.log
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "
            nohup sh -c 'DOCKER_BUILDKIT=0 docker build -f \"$SOURCE_PATH/Dockerfile.dispatch\" -t \"$DISPATCH_IMAGE\" \"$SOURCE_PATH\" >\"$BUILD_LOG\" 2>&1; echo \$? >\"$BUILD_LOG.exit\"' &
          "
          while true; do
            if ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "test -f \"$BUILD_LOG.exit\"" 2>/dev/null; then
              break
            fi
            echo "Dispatch build running..."
            sleep 15
          done
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "cat \"$BUILD_LOG\""
          EXIT_CODE=$(ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "cat \"$BUILD_LOG.exit\"")
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "rm -f \"$BUILD_LOG\" \"$BUILD_LOG.exit\""
          exit "$EXIT_CODE"

      - name: Build notification image
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          NOTIFICATION_IMAGE: truckmoov-notification:sha-${{ github.sha }}
          SOURCE_PATH: /var/www/truckmoov-go/source/${{ github.sha }}
          BUILD_LOG: /tmp/build-notification-${{ github.sha }}.log
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "
            nohup sh -c 'DOCKER_BUILDKIT=0 docker build -f \"$SOURCE_PATH/Dockerfile.notification\" -t \"$NOTIFICATION_IMAGE\" \"$SOURCE_PATH\" >\"$BUILD_LOG\" 2>&1; echo \$? >\"$BUILD_LOG.exit\"' &
          "
          while true; do
            if ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "test -f \"$BUILD_LOG.exit\"" 2>/dev/null; then
              break
            fi
            echo "Notification build running..."
            sleep 15
          done
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "cat \"$BUILD_LOG\""
          EXIT_CODE=$(ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "cat \"$BUILD_LOG.exit\"")
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "rm -f \"$BUILD_LOG\" \"$BUILD_LOG.exit\""
          exit "$EXIT_CODE"

      - name: Build tracking image
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          TRACKING_IMAGE: truckmoov-tracking:sha-${{ github.sha }}
          SOURCE_PATH: /var/www/truckmoov-go/source/${{ github.sha }}
          BUILD_LOG: /tmp/build-tracking-${{ github.sha }}.log
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "
            nohup sh -c 'DOCKER_BUILDKIT=0 docker build -f \"$SOURCE_PATH/Dockerfile.tracking\" -t \"$TRACKING_IMAGE\" \"$SOURCE_PATH\" >\"$BUILD_LOG\" 2>&1; echo \$? >\"$BUILD_LOG.exit\"' &
          "
          while true; do
            if ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "test -f \"$BUILD_LOG.exit\"" 2>/dev/null; then
              break
            fi
            echo "Tracking build running..."
            sleep 15
          done
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "cat \"$BUILD_LOG\""
          EXIT_CODE=$(ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "cat \"$BUILD_LOG.exit\"")
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "rm -f \"$BUILD_LOG\" \"$BUILD_LOG.exit\""
          exit "$EXIT_CODE"

      - name: Import images into k3s
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DISPATCH_IMAGE: truckmoov-dispatch:sha-${{ github.sha }}
          NOTIFICATION_IMAGE: truckmoov-notification:sha-${{ github.sha }}
          TRACKING_IMAGE: truckmoov-tracking:sha-${{ github.sha }}
          BUILD_LOG: /tmp/import-go-images-${{ github.sha }}.log
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "
            nohup sh -c '
              docker save \"$DISPATCH_IMAGE\" -o /tmp/dispatch-image.tar &&
              sudo -n k3s ctr images import /tmp/dispatch-image.tar &&
              rm -f /tmp/dispatch-image.tar &&
              docker save \"$NOTIFICATION_IMAGE\" -o /tmp/notification-image.tar &&
              sudo -n k3s ctr images import /tmp/notification-image.tar &&
              rm -f /tmp/notification-image.tar &&
              docker save \"$TRACKING_IMAGE\" -o /tmp/tracking-image.tar &&
              sudo -n k3s ctr images import /tmp/tracking-image.tar &&
              rm -f /tmp/tracking-image.tar
              echo \$? >\"$BUILD_LOG.exit\"
            ' >\"$BUILD_LOG\" 2>&1 &
          "
          while true; do
            if ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "test -f \"$BUILD_LOG.exit\"" 2>/dev/null; then
              break
            fi
            echo "Importing images..."
            sleep 10
          done
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "cat \"$BUILD_LOG\""
          EXIT_CODE=$(ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "cat \"$BUILD_LOG.exit\"")
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "rm -f \"$BUILD_LOG\" \"$BUILD_LOG.exit\""
          exit "$EXIT_CODE"

      - name: Deploy services
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DISPATCH_MANIFEST_PATH: /var/www/truckmoov-go/rendered/${{ github.sha }}/dispatch
          NOTIFICATION_MANIFEST_PATH: /var/www/truckmoov-go/rendered/${{ github.sha }}/notification
          TRACKING_MANIFEST_PATH: /var/www/truckmoov-go/rendered/${{ github.sha }}/tracking
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$RUNNER_TEMP/dev_ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$DEV_SSH_USER@$DEV_SSH_HOST" "
            set -eu
            kubectl apply --validate=false -k \"$DISPATCH_MANIFEST_PATH\"
            kubectl apply --validate=false -k \"$NOTIFICATION_MANIFEST_PATH\"
            kubectl apply --validate=false -k \"$TRACKING_MANIFEST_PATH\"
            kubectl rollout status deployment/dispatch-service -n truckmoov --timeout=300s || {
              kubectl describe deployment dispatch-service -n truckmoov
              kubectl logs -n truckmoov -l app.kubernetes.io/name=dispatch-service --all-containers --tail=200
              kubectl get events -n truckmoov --sort-by=.metadata.creationTimestamp | tail -n 50
              exit 1
            }
            kubectl rollout status deployment/notification-service -n truckmoov --timeout=300s || {
              kubectl describe deployment notification-service -n truckmoov
              kubectl logs -n truckmoov -l app.kubernetes.io/name=notification-service --all-containers --tail=200
              kubectl get events -n truckmoov --sort-by=.metadata.creationTimestamp | tail -n 50
              exit 1
            }
            kubectl rollout status deployment/tracking-service -n truckmoov --timeout=300s || {
              kubectl describe deployment tracking-service -n truckmoov
              kubectl logs -n truckmoov -l app.kubernetes.io/name=tracking-service --all-containers --tail=200
              kubectl get events -n truckmoov --sort-by=.metadata.creationTimestamp | tail -n 50
              exit 1
            }
          "
