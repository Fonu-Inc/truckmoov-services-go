name: Go Services CI/CD

on:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "api/**"
      - "deploy/**"
      - "docs/**"
      - "Dockerfile.dispatch"
      - "Dockerfile.notification"
      - "Dockerfile.tracking"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".env.example"
      - ".github/workflows/services-go-cicd.yml"
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "api/**"
      - "deploy/**"
      - "docs/**"
      - "Dockerfile.dispatch"
      - "Dockerfile.notification"
      - "Dockerfile.tracking"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".env.example"
      - ".github/workflows/services-go-cicd.yml"
  workflow_dispatch:

concurrency:
  group: services-go-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GO_VERSION: "1.22.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./cmd ./internal ./pkg)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet packages
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build service binaries
        run: |
          set -euo pipefail
          go build ./cmd/dispatch
          go build ./cmd/notification
          go build ./cmd/tracking

  publish:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dispatch
            dockerfile: Dockerfile.dispatch
          - service: notification
            dockerfile: Dockerfile.notification
          - service: tracking
            dockerfile: Dockerfile.tracking
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fonu-inc/truckmoov-${{ matrix.service }}:sha-${{ github.sha }}

  update-gitops:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Fonu-Inc/truckmoov-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump image tags
        run: |
          set -euo pipefail
          for service in dispatch notification tracking; do
            (cd gitops/manifests/$service && kustomize edit set image "ghcr.io/fonu-inc/truckmoov-${service}:sha-${GIT_SHA}")
          done
          cd gitops
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git diff --quiet && exit 0
          git commit -am "chore: bump go services to sha-${GIT_SHA}"
          git push
