name: Commit messages

# Runs on every PR regardless of which files changed — this checks commit
# messages, not code. It is the real gate: the .githooks/commit-msg hook is
# opt-in locally (git config core.hooksPath .githooks) and can be skipped
# with --no-verify, so it catches mistakes early but does not enforce anything
# on its own.
on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19

      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
